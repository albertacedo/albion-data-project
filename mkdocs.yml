site_name: Albion Data Project
site_description: Personal Albion Online market tool (AODP API + own sniffer + NATS)
site_url: https://albertacedo.github.io/albion-data-project/
repo_url: https://github.com/albertacedo/albion-data-project
repo_name: albertacedo/albion-data-project
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - Status: status.md
  - Moving to another machine: handover.md
  - Architecture: architecture.md
  - Installation: installation.md
  - Data sources: data-sources.md
  - Database: database.md
  - Client (sniffer): client.md
  - Usage: usage.md
  - Roadmap: roadmap.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - toc:
      permalink: true
