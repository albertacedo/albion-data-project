site_name: Albion Data Project
site_description: Eina personal de mercat per a Albion Online (API AODP + sniffer propi + NATS)
site_url: https://albertacedo.github.io/albion-data-project/
repo_url: https://github.com/albertacedo/albion-data-project
repo_name: albertacedo/albion-data-project
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: ca
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Mode fosc
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Mode clar
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - toc.follow

nav:
  - Inici: index.md
  - Arquitectura: arquitectura.md
  - Instal·lació: instalacio.md
  - Fonts de dades: fonts-de-dades.md
  - Base de dades: base-de-dades.md
  - Client (sniffer): client-sniffer.md
  - Ús diari: us-diar.md
  - Properes passes: properes-passes.md
  - Registre del projecte: registre.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - toc:
      permalink: true
